# Configuration pour l'application SIREN - Téléchargement mensuel depuis data.gouv.fr
# L'application télécharge les fichiers INSEE depuis data.gouv.fr et les stocke dans Azure Storage
# Exécution mensuelle avec logique "annule et remplace"

# Planification mensuelle
execution:
  monthly_day: 2  # Jour du mois (1-31)
  monthly_hour: 2  # Heure de la journée (0-23)

# Configuration Azure Storage
azure:
  storage_account_name: "YOUR_STORAGE_ACCOUNT"
  storage_account_key: "YOUR_STORAGE_ACCOUNT_KEY"
  container_name: "siren-data"
  connection_string: ""  # Optionnel: connection string complète
  blob_prefix: "insee/"  # Préfixe pour les fichiers dans le container

# Répertoires locaux
directories:
  data_dir: "./data"
  logs_dir: "./logs"
  temp_dir: "./data/temp"
  state_file: "./data/state.json"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_max_bytes: 10485760  # 10MB
  file_backup_count: 5

# Paramètres de traitement
processing:
  download_timeout: 120  # Timeout pour le téléchargement des fichiers (en secondes)
